<!doctype html>
<!--
  Source for public/og/default.png, the 1200x630 social preview image.
  To re-render after editing: open this file in Chromium at a 1200x630 viewport
  and take a screenshot, e.g. with Playwright:
    page.setViewportSize({ width: 1200, height: 630 }); page.goto('file://.../default.html');
    page.screenshot({ path: 'public/og/default.png' });
  Colours mirror src/styles/tokens.css; copy comes from docs/content-brief.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Archivo Black'; src: url('../../src/assets/fonts/archivo-black-latin.woff2'); }
      @font-face { font-family: 'Inter'; src: url('../../src/assets/fonts/inter-latin-var.woff2'); font-weight: 400 700; }
      @font-face { font-family: 'JetBrains Mono'; src: url('../../src/assets/fonts/jetbrains-mono-latin-var.woff2'); font-weight: 400 700; }
      :root { --bg: #f5efe0; --surface: #fffaf0; --ink: #1a1a1a; --muted: #4a4a4a; --coral: #ff5a3c; --yellow: #f0c040; }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; padding: 56px 64px; display: flex; }
      .card { position: relative; flex: 1; background: var(--surface); border: 4px solid var(--ink); box-shadow: 14px 14px 0 var(--ink); padding: 52px 56px; display: flex; flex-direction: column; justify-content: space-between; }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .mark { font-family: 'Archivo Black'; font-size: 34px; background: var(--coral); border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 6px 12px 2px; line-height: 1.1; }
      .tag { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; border: 3px solid var(--ink); background: var(--yellow); padding: 8px 14px; }
      h1 { font-family: 'Archivo Black'; font-weight: 400; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; }
      .hl { background: var(--coral); color: #fff; padding: 0 14px; display: inline-block; margin-top: 8px; }
      p { font-size: 29px; line-height: 1.4; color: var(--muted); max-width: 920px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <span class="mark">KJ</span>
        <span class="tag">Bengaluru, India</span>
      </div>
      <h1>Kushal<br /><span class="hl">Jayavarapu</span></h1>
      <p>Computer science student building AI and data systems, from LLM-agent robustness research to hackathon prototypes.</p>
    </div>
  </body>
</html>
